name: music-guesser-server
# DigitalOcean App Platform Configuration
# Deploy via: doctl apps create --spec app.yaml

services:
- name: server
  github:
    # Update these with your actual GitHub details
    repo: YOUR_GITHUB_USERNAME/MusicGuesser
    branch: main
  build_command: pip install -r server/requirements.txt
  run_command: python server/main.py
  source_dir: /
  http_port: 8000
  
  # Resource allocation
  instance_count: 1
  instance_size_slug: basic-xs  # 512 MB RAM, suitable for this app
  
  # Environment variables
  envs:
  - key: PORT
    value: "8000"
  - key: HOST
    value: "0.0.0.0"
  - key: DEBUG
    value: "False"
  - key: CORS_ORIGINS
    scope: RUN_AND_BUILD_TIME
    # Update this with your actual frontend URL
    value: "https://your-frontend.vercel.app"
  
  # Health check
  health_check:
    http_path: /
    http_port: 8000
    initial_delay_seconds: 5
    period_seconds: 10
    timeout_seconds: 5
    unhealthy_threshold: 5
  
  # HTTPS configuration
  http_port: 8000
  https_redirect_uri: https://
